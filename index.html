<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Thumbnail - Samuel Santos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@300;400;700&family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700;800&family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0F172A;
      --accent-primary: #2563EB;
      --accent-secondary: #1D4ED8;
      --icon-color: #F8FAFC;
      --text-color: #FFFFFF;
      --subtitle-color: #A5B4CF;
      --page-bg: #eef3f9;
      --panel-bg: rgba(255,255,255,0.8);
      --panel-border: rgba(148, 163, 184, 0.24);
      --soft-field: rgba(248,250,252,0.95);
      --soft-label: #475569;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.09);
      --font-body: 'Inter', sans-serif;
      --font-heading: 'Space Grotesk', 'Inter', sans-serif;
      --font-subtitle: 'Merriweather', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 18%),
        linear-gradient(180deg, #f6f8fc 0%, var(--page-bg) 100%);
      color: #0f172a;
      min-height: 100vh;
      padding: 32px 16px 60px;
    }

    .app-shell {
      max-width: 1320px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      font-size: clamp(1.7rem, 2vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #0f172a;
    }

    .mini-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.04);
      border: 1px solid rgba(15,23,42,0.08);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #475569;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .controls-panel {
      padding: 22px;
    }

    .controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--soft-label);
      font-weight: 800;
    }

    .ghost-btn {
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(255,255,255,0.7);
      color: #0f172a;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .input-group.wide {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--soft-label);
      font-weight: 800;
    }

    input[type="text"],
    select {
      width: 100%;
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 12px;
      background: var(--soft-field);
      padding: 11px 12px;
      font-size: 0.96rem;
      color: #0f172a;
      font-family: inherit;
    }

    input[type="text"]:focus,
    select:focus {
      outline: 0;
      border-color: rgba(37,99,235,0.5);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
    }

    .color-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 12px;
      background: var(--soft-field);
      padding: 7px 10px;
    }

    .color-preview {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(15,23,42,0.12);
      background: linear-gradient(135deg, #0F172A, #2563EB);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .color-action button {
      width: 100%;
      border: none;
      background: transparent;
      color: #0f172a;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: left;
      padding: 0;
    }

    .icon-box {
      border: 1px solid rgba(148,163,184,0.35);
      background: var(--soft-field);
      border-radius: 14px;
      padding: 12px;
    }

    .icon-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .icon-checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(255,255,255,0.8);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: none;
      color: #334155;
      cursor: pointer;
    }

    .icon-checkbox-group input[type="checkbox"] {
      accent-color: #2563eb;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .primary-btn {
      border: none;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(37,99,235,0.22);
    }

    .preview-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      min-height: 640px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(248,250,252,0.7));
    }

    .preview-shell {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }

    #thumbnail-container {
      width: min(100%, 980px);
      height: 520px;
      background: var(--bg-dark);
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 20px 38px rgba(15, 23, 42, 0.18);
      border-radius: 18px;
      transform-origin: center top;
      transform: scale(0.88);
      margin-bottom: -120px;
      border: 1px solid rgba(148,163,184,0.15);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 38px 38px;
      opacity: 0.44;
      z-index: 1;
    }

    .bg-glow {
      position: absolute;
      right: -10%;
      top: -14%;
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, rgba(255,255,255,0.09), transparent 64%);
      z-index: 1;
    }

    .content-side {
      flex: 1.42;
      padding: 52px 48px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-color);
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .main-title {
      color: var(--text-color);
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 3vw, 4rem);
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.06em;
      margin-bottom: 16px;
      max-width: 90%;
    }

    .subtitle {
      color: var(--subtitle-color);
      font-family: var(--font-subtitle);
      font-size: clamp(1.1rem, 1.7vw, 1.8rem);
      line-height: 1.3;
      max-width: 86%;
      font-weight: 300;
    }

    .tech-stack {
      margin-top: 30px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      max-width: 82%;
    }

    .tech-icon {
      font-size: 2.2rem;
      color: var(--icon-color);
      opacity: 0.96;
    }

    .image-side {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .image-blob-container {
      position: relative;
      width: 420px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blob-bg {
      position: absolute;
      inset: 0;
      background: var(--accent-primary);
      opacity: 0.2;
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      animation: morph 8s ease-in-out infinite;
    }

    .profile-img-frame {
      width: 350px;
      height: 350px;
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      overflow: hidden;
      position: relative;
      border: 5px solid rgba(255,255,255,0.1);
      background: rgba(15,23,42,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(15,23,42,0.15);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-text {
      color: rgba(255,255,255,0.45);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    @keyframes morph {
      0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
      33% { border-radius: 70% 30% 30% 70% / 60% 40% 60% 40%; }
      66% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-card {
      width: min(860px, 92vw);
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.22);
      border: 1px solid rgba(148,163,184,0.2);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }

    .modal-header h3 {
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .close-modal {
      background: rgba(15,23,42,0.04);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      color: #475569;
      font-weight: 700;
    }

    .modal-body {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 18px;
      padding: 18px 20px 20px;
    }

    .picker-box,
    .palette-box {
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 16px;
      background: #f8fafc;
      padding: 14px;
    }

    .picker-section {
      display: grid;
      gap: 12px;
    }

    .mini-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      background: white;
      padding: 8px 10px;
    }

    .color-row input[type="color"] {
      width: 40px;
      height: 38px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .color-row input[type="text"] {
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      font-weight: 700;
      color: #0f172a;
      font-size: 0.92rem;
    }

    .palette-box {
      display: grid;
      gap: 12px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .swatch-btn {
      position: relative;
      height: 46px;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(135deg, #fff, #ddd);
    }

    .swatch-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--swatch-a), var(--swatch-b));
    }

    .swatch-btn.active {
      box-shadow: 0 0 0 2px rgba(37,99,235,0.35);
      border-color: rgba(37,99,235,0.4);
    }

    .gradient-block {
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      background: white;
      padding: 10px;
    }

    .gradient-strip {
      width: 100%;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0f172a, #2563eb, #f8fafc);
      border: 1px solid rgba(148,163,184,0.18);
    }

    .quad-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .ramp-swatch {
      height: 32px;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 10px;
      cursor: pointer;
      background: #ccc;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 18px;
    }

    .secondary-btn {
      border: 1px solid rgba(148,163,184,0.25);
      background: #fff;
      color: #0f172a;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-btn-modal {
      border: none;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        min-height: auto;
      }

      #thumbnail-container {
        transform: scale(0.7);
        margin-bottom: -150px;
      }
    }

    @media (max-width: 700px) {
      .form-grid,
      .modal-body,
      .mini-row,
      .palette-grid,
      .quad-grid {
        grid-template-columns: 1fr;
      }

      #thumbnail-container {
        transform: scale(0.56);
        margin-bottom: -200px;
      }

      .controls-panel {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <h1>Gerador de Thumbnail</h1>
      <div class="mini-tag"><i class="fas fa-swatchbook"></i> Editor visual</div>
    </div>

    <div class="workspace">
      <section class="panel controls-panel">
        <div class="controls-header">
          <div class="section-title">Configuração</div>
          <button class="ghost-btn" onclick="openColorModal()"><i class="fas fa-palette"></i> Cores</button>
        </div>

        <div class="form-grid">
          <div class="input-group wide">
            <label>Título principal</label>
            <input type="text" id="inputTitle" value="Samuel Santos" oninput="updateContent()">
          </div>

          <div class="input-group wide">
            <label>Badge/etiqueta</label>
            <input type="text" id="inputBadge" value="Portfólio Profissional" oninput="updateContent()">
          </div>

          <div class="input-group wide">
            <label>Subtítulo</label>
            <input type="text" id="inputSubtitle" value="Especialista em Geotecnologias" oninput="updateContent()">
          </div>

          <div class="input-group">
            <label>Fonte</label>
            <select id="fontSelect" onchange="updateFont()">
              <option value="'Inter', sans-serif">Inter</option>
              <option value="'Space Grotesk', 'Inter', sans-serif">Space Grotesk</option>
              <option value="'Manrope', 'Inter', sans-serif">Manrope</option>
              <option value="'Poppins', 'Inter', sans-serif">Poppins</option>
              <option value="'Montserrat', 'Inter', sans-serif">Montserrat</option>
              <option value="'Source Sans 3', 'Inter', sans-serif">Source Sans 3</option>
              <option value="'Merriweather', serif">Merriweather</option>
              <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
            </select>
          </div>

          <div class="input-group">
            <label>Foto de perfil</label>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
          </div>

          <div class="input-group wide">
            <label>Temas</label>
            <div class="color-action">
              <span class="color-preview" id="themePreview"></span>
              <button type="button" onclick="openColorModal()">Editar cor do tema</button>
            </div>
          </div>

          <div class="input-group icon-picker" style="grid-column:1 / -1;">
            <label>Tecnologias (máx. 5)</label>
            <div class="icon-box">
              <div class="icon-checkbox-group" id="iconCheckboxes"></div>
            </div>
          </div>
        </div>

        <div class="action-row">
          <button class="primary-btn" onclick="downloadThumbnail()"><i class="fas fa-download"></i> Baixar PNG</button>
        </div>
      </section>

      <aside class="panel preview-panel">
        <div class="preview-shell">
          <div id="thumbnail-container">
            <div class="bg-grid"></div>
            <div class="bg-glow"></div>

            <div class="content-side">
              <div class="badge" id="displayBadge">
                <i class="fas fa-code"></i>
                <span>Portfólio Profissional</span>
              </div>

              <h1 class="main-title" id="displayTitle">Samuel Santos</h1>
              <p class="subtitle" id="displaySubtitle">Especialista em Geotecnologias</p>

              <div class="tech-stack" id="displayTechStack"></div>
            </div>

            <div class="image-side">
              <div class="image-blob-container">
                <div class="blob-bg"></div>
                <div class="profile-img-frame">
                  <img id="displayImage" class="profile-img" style="display:none;">
                  <div class="placeholder-text">Carregando...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div id="colorModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Cores do tema</h3>
        <button class="close-modal" onclick="closeColorModal()" aria-label="Fechar">×</button>
      </div>

      <div class="modal-body">
        <div class="picker-box">
          <div class="picker-section">
            <div class="mini-row">
              <div>
                <label>Fundo</label>
                <div class="color-row">
                  <input type="color" id="modalBgDark" value="#0F172A">
                  <input type="text" id="modalBgDarkHex" value="#0F172A" maxlength="7">
                </div>
              </div>

              <div>
                <label>Destaque</label>
                <div class="color-row">
                  <input type="color" id="modalAccentPrimary" value="#2563EB">
                  <input type="text" id="modalAccentPrimaryHex" value="#2563EB" maxlength="7">
                </div>
              </div>
            </div>

            <div class="mini-row">
              <div>
                <label>Texto</label>
                <div class="color-row">
                  <input type="color" id="modalTextColor" value="#FFFFFF">
                  <input type="text" id="modalTextColorHex" value="#FFFFFF" maxlength="7">
                </div>
              </div>

              <div>
                <label>Ícones</label>
                <div class="color-row">
                  <input type="color" id="modalIconColor" value="#F8FAFC">
                  <input type="text" id="modalIconColorHex" value="#F8FAFC" maxlength="7">
                </div>
              </div>
            </div>

            <div>
              <label>Subtítulo</label>
              <div class="color-row">
                <input type="color" id="modalSubtitleColor" value="#A5B4CF">
                <input type="text" id="modalSubtitleColorHex" value="#A5B4CF" maxlength="7">
              </div>
            </div>
          </div>
        </div>

        <div class="palette-box">
          <div>
            <label>Paletas rápidas</label>
            <div class="palette-grid" id="modalPaletteGrid"></div>
          </div>

          <div>
            <label>Rampa</label>
            <div class="gradient-block">
              <div class="gradient-strip" id="rampStrip"></div>
              <div class="quad-grid" id="rampSwatches"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="secondary-btn" type="button" onclick="closeColorModal()">Cancelar</button>
        <button class="primary-btn-modal" type="button" onclick="applyThemeFromModal()">Aplicar</button>
      </div>
    </div>
  </div>

  <div id="cropModal" class="modal-overlay" style="background: rgba(15,23,42,0.8);">
    <div class="modal-card" style="max-width:620px;">
      <div class="modal-header">
        <h3>Ajustar imagem</h3>
        <button class="close-modal" onclick="closeCropper()">×</button>
      </div>
      <div class="modal-body" style="display:block; padding-top:14px;">
        <div class="picker-box" style="padding:0; overflow:hidden;">
          <div style="max-height:420px; overflow:hidden;">
            <img id="imageCropper" alt="Imagem para recorte" style="display:block; width:100%; max-width:100%;">
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary-btn" type="button" onclick="closeCropper()">Cancelar</button>
        <button class="primary-btn-modal" id="cropAndApply" type="button"><i class="fas fa-check"></i> Aplicar</button>
      </div>
    </div>
  </div>

  <script>
    let cropper;
    const root = document.documentElement;

    const colorPresets = [
      { name: 'Aipim', bg: '#0F172A', accent: '#22C55E', text: '#FFFFFF', icon: '#F8FAFC', subtitle: '#B7C5DE' },
      { name: 'Ocean', bg: '#061B2D', accent: '#2DD4BF', text: '#ECFEFF', icon: '#E0F2FE', subtitle: '#A9CDE3' },
      { name: 'Sunset', bg: '#1F2937', accent: '#F97316', text: '#FFF7ED', icon: '#FFF7ED', subtitle: '#F5CC9C' },
      { name: 'Violet', bg: '#111827', accent: '#A78BFA', text: '#F5F3FF', icon: '#F5F3FF', subtitle: '#CCC3F2' },
      { name: 'Rose', bg: '#1F1B2D', accent: '#F472B6', text: '#FDF2F8', icon: '#FDF2F8', subtitle: '#F7D4EC' },
      { name: 'Lime', bg: '#132A13', accent: '#84CC16', text: '#F0FDF4', icon: '#F0FDF4', subtitle: '#CFEFC0' },
      { name: 'Slate', bg: '#111827', accent: '#60A5FA', text: '#F8FAFC', icon: '#F8FAFC', subtitle: '#B7C4D7' },
      { name: 'Amber', bg: '#1E293B', accent: '#F59E0B', text: '#FFF7ED', icon: '#FFF7ED', subtitle: '#F7D49A' }
    ];

    const allTechIcons = [
      { name: "Python", class: "fab fa-python" },
      { name: "JavaScript", class: "fab fa-js" },
      { name: "TypeScript", class: "fas fa-code" },
      { name: "HTML5", class: "fab fa-html5" },
      { name: "CSS3", class: "fab fa-css3-alt" },
      { name: "React", class: "fab fa-react" },
      { name: "Vue", class: "fab fa-vuejs" },
      { name: "Angular", class: "fab fa-angular" },
      { name: "Node.js", class: "fab fa-node-js" },
      { name: "Next.js", class: "fas fa-rocket" },
      { name: "Tailwind", class: "fas fa-wind" },
      { name: "Git", class: "fab fa-git-alt" },
      { name: "Docker", class: "fab fa-docker" },
      { name: "Figma", class: "fab fa-figma" },
      { name: "Database", class: "fas fa-database" },
      { name: "PostgreSQL", class: "fas fa-server" },
      { name: "MongoDB", class: "fas fa-database" },
      { name: "Redis", class: "fas fa-memory" },
      { name: "Cloud", class: "fas fa-cloud" },
      { name: "AWS", class: "fab fa-aws" },
      { name: "Mapa/GIS", class: "fas fa-map-marked-alt" },
      { name: "Análise", class: "fas fa-chart-pie" },
      { name: "IA", class: "fas fa-brain" },
      { name: "Design", class: "fas fa-paint-brush" },
      { name: "PHP", class: "fab fa-php" },
      { name: "Laravel", class: "fab fa-laravel" },
      { name: "Go", class: "fas fa-code" },
      { name: "Java", class: "fab fa-java" },
      { name: "C#", class: "fas fa-code" }
    ];

    const appState = {
      bg: '#0F172A',
      accent: '#2563EB',
      text: '#FFFFFF',
      icon: '#F8FAFC',
      subtitle: '#A5B4CF'
    };

    function normalizeHex(value, fallback = '#000000') {
      if (!value) return fallback;
      let raw = value.trim();
      if (!raw) return fallback;
      if (raw.startsWith('#')) raw = raw.slice(1);
      if (raw.length === 3) raw = raw.split('').map(ch => ch + ch).join('');
      if (/^[0-9a-fA-F]{6}$/.test(raw)) return '#' + raw.toUpperCase();
      return fallback;
    }

    function hexToRgba(hex, opacity) {
      const normalized = normalizeHex(hex, '#2563EB');
      const r = parseInt(normalized.substring(1, 3), 16);
      const g = parseInt(normalized.substring(3, 5), 16);
      const b = parseInt(normalized.substring(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${opacity})`;
    }

    function updateThemePreview() {
      document.getElementById('themePreview').style.background = `linear-gradient(135deg, ${appState.accent}, ${appState.bg})`;
    }

    function renderPresets() {
      const grid = document.getElementById('modalPaletteGrid');
      grid.innerHTML = '';
      colorPresets.forEach((preset) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'swatch-btn';
        btn.title = preset.name;
        btn.style.setProperty('--swatch-a', preset.accent);
        btn.style.setProperty('--swatch-b', preset.bg);
        btn.addEventListener('click', () => {
          appState.bg = preset.bg;
          appState.accent = preset.accent;
          appState.text = preset.text;
          appState.icon = preset.icon;
          appState.subtitle = preset.subtitle;
          syncMainInputs();
          syncModalInputs();
          updateColors();
          document.querySelectorAll('.swatch-btn').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
        });
        grid.appendChild(btn);
      });
    }

    function renderRampSwatches() {
      const swatches = document.getElementById('rampSwatches');
      const ramp = [
        '#0F172A', '#1E293B', '#2563EB', '#22C55E', '#F59E0B', '#A78BFA', '#F472B6', '#F8FAFC'
      ];
      swatches.innerHTML = '';
      ramp.forEach(color => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'ramp-swatch';
        dot.style.background = color;
        dot.title = color;
        dot.addEventListener('click', () => {
          appState.accent = color;
          syncMainInputs();
          syncModalInputs();
          updateColors();
        });
        swatches.appendChild(dot);
      });
    }

    function syncMainInputs() {
      document.getElementById('inputBgDark').value = appState.bg;
      document.getElementById('inputAccentPrimary').value = appState.accent;
      document.getElementById('inputTextColor').value = appState.text;
      document.getElementById('inputIconColor').value = appState.icon;
      document.getElementById('inputSubtitleColor').value = appState.subtitle;
    }

    function syncModalInputs() {
      document.getElementById('modalBgDark').value = appState.bg;
      document.getElementById('modalAccentPrimary').value = appState.accent;
      document.getElementById('modalTextColor').value = appState.text;
      document.getElementById('modalIconColor').value = appState.icon;
      document.getElementById('modalSubtitleColor').value = appState.subtitle;

      document.getElementById('modalBgDarkHex').value = appState.bg;
      document.getElementById('modalAccentPrimaryHex').value = appState.accent;
      document.getElementById('modalTextColorHex').value = appState.text;
      document.getElementById('modalIconColorHex').value = appState.icon;
      document.getElementById('modalSubtitleColorHex').value = appState.subtitle;
    }

    function readModalColors() {
      appState.bg = normalizeHex(document.getElementById('modalBgDark').value, appState.bg);
      appState.accent = normalizeHex(document.getElementById('modalAccentPrimary').value, appState.accent);
      appState.text = normalizeHex(document.getElementById('modalTextColor').value, appState.text);
      appState.icon = normalizeHex(document.getElementById('modalIconColor').value, appState.icon);
      appState.subtitle = normalizeHex(document.getElementById('modalSubtitleColor').value, appState.subtitle);
      syncMainInputs();
      syncModalInputs();
      updateColors();
    }

    function openColorModal() {
      syncModalInputs();
      document.getElementById('colorModal').style.display = 'flex';
    }

    function closeColorModal() {
      document.getElementById('colorModal').style.display = 'none';
    }

    function applyThemeFromModal() {
      readModalColors();
      closeColorModal();
    }

    function updateColors() {
      const darkHex = normalizeHex(appState.bg, '#0F172A');
      const accentHex = normalizeHex(appState.accent, '#2563EB');
      const textHex = normalizeHex(appState.text, '#FFFFFF');
      const iconHex = normalizeHex(appState.icon, '#F8FAFC');
      const subtitleHex = normalizeHex(appState.subtitle, '#A5B4CF');

      root.style.setProperty('--bg-dark', darkHex);
      root.style.setProperty('--accent-primary', accentHex);
      root.style.setProperty('--accent-secondary', hexToRgba(accentHex, 0.88).replace(/rgba\(([^)]+)\)/, (_, rgb) => {
        const [r, g, b] = rgb.split(',').map(Number);
        return `rgb(${Math.max(0, r - 18)}, ${Math.max(0, g - 18)}, ${Math.max(0, b - 18)})`;
      }));
      root.style.setProperty('--text-color', textHex);
      root.style.setProperty('--icon-color', iconHex);
      root.style.setProperty('--subtitle-color', subtitleHex);
      root.style.setProperty('--accent-primary-low-opacity', hexToRgba(accentHex, 0.18));
      root.style.setProperty('--accent-primary-medium-opacity', hexToRgba(accentHex, 0.38));
      root.style.setProperty('--bg-dark-transparent', hexToRgba(darkHex, 0));

      document.getElementById('themePreview').style.background = `linear-gradient(135deg, ${accentHex}, ${darkHex})`;
      appState.bg = darkHex;
      appState.accent = accentHex;
      appState.text = textHex;
      appState.icon = iconHex;
      appState.subtitle = subtitleHex;
      syncMainInputs();
      syncModalInputs();
    }

    function updateFont() {
      const selected = document.getElementById('fontSelect').value;
      root.style.setProperty('--font-body', selected);
      root.style.setProperty('--font-heading', selected);
      document.body.style.fontFamily = selected;
    }

    function renderIconCheckboxes() {
      const container = document.getElementById('iconCheckboxes');
      container.innerHTML = '';
      allTechIcons.forEach(icon => {
        const id = `tech-${icon.name.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
        const checked = ['Python', 'JavaScript', 'Database', 'Mapa/GIS', 'Análise', 'Cloud'].includes(icon.name);

        const label = document.createElement('label');
        label.setAttribute('for', id);

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = id;
        input.value = icon.class;
        input.checked = checked;
        input.onchange = updateTechStack;

        const iconEl = document.createElement('i');
        iconEl.className = icon.class;

        const text = document.createTextNode(icon.name);
        label.appendChild(input);
        label.appendChild(iconEl);
        label.appendChild(text);
        container.appendChild(label);
      });
      updateTechStack();
    }

    function updateTechStack() {
      const selected = [...document.querySelectorAll('#iconCheckboxes input:checked')];
      const display = document.getElementById('displayTechStack');
      display.innerHTML = '';
      const selectedIcons = selected.slice(0, 5);
      selectedIcons.forEach(cb => {
        const icon = document.createElement('i');
        icon.className = `${cb.value} tech-icon`;
        display.appendChild(icon);
      });

      const boxes = document.querySelectorAll('#iconCheckboxes input');
      if (selected.length >= 5) {
        boxes.forEach(cb => {
          if (!cb.checked) cb.disabled = true;
        });
      } else {
        boxes.forEach(cb => cb.disabled = false);
      }
    }

    function updateContent() {
      document.getElementById('displayTitle').innerText = document.getElementById('inputTitle').value;
      document.getElementById('displaySubtitle').innerText = document.getElementById('inputSubtitle').value;
      const badge = document.getElementById('displayBadge');
      badge.innerHTML = `<i class="fas fa-code"></i><span>${document.getElementById('inputBadge').value || 'Portfólio Profissional'}</span>`;
    }

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    function openCropper(imageUrl) {
      const modal = document.getElementById('cropModal');
      const image = document.getElementById('imageCropper');
      image.src = imageUrl;
      modal.style.display = 'flex';
      if (cropper) cropper.destroy();
      cropper = new Cropper(image, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 0.9,
        responsive: true,
        background: false
      });
    }

    function closeCropper() {
      document.getElementById('cropModal').style.display = 'none';
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      document.getElementById('imageInput').value = '';
    }

    document.getElementById('cropAndApply').addEventListener('click', () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ width: 420, height: 420 });
      const base64 = canvas.toDataURL('image/jpeg');
      const output = document.getElementById('displayImage');
      output.src = base64;
      output.style.display = 'block';
      document.querySelector('.placeholder-text').style.display = 'none';
      closeCropper();
    });

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const base64 = await fileToBase64(file);
        openCropper(base64);
      } catch (err) {
        console.error('Erro ao ler arquivo', err);
      }
    }

    function downloadThumbnail() {
      const element = document.getElementById('thumbnail-container');
      const currentTransform = element.style.transform;
      const currentMargin = element.style.marginBottom;

      element.style.transform = 'scale(1)';
      element.style.marginBottom = '0';

      setTimeout(() => {
        html2canvas(element, {
          backgroundColor: root.style.getPropertyValue('--bg-dark'),
          scale: 1,
          useCORS: true,
          allowTaint: true
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = 'thumbnail-personalizada.png';
          link.href = canvas.toDataURL('image/png');
          link.click();

          element.style.transform = currentTransform;
          element.style.marginBottom = currentMargin;
        }).catch(err => {
          console.error('Erro ao gerar imagem:', err);
          const modal = document.createElement('div');
          modal.style.cssText = `
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 12px; box-shadow: 0 18px 36px rgba(15,23,42,0.18);
            z-index: 2001; text-align: center; font-family: 'Inter', sans-serif;
          `;
          modal.innerHTML = `
            <p style="font-weight:800; color:#ef4444;">Erro na captura</p>
            <p style="margin-top:10px; color:#0f172a;">Verifique o console e tente novamente.</p>
            <button onclick="this.parentNode.remove()" style="margin-top:18px; background:#ef4444; color:white; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer;">Fechar</button>
          `;
          document.body.appendChild(modal);

          element.style.transform = currentTransform;
          element.style.marginBottom = currentMargin;
        });
      }, 80);
    }

    function initModalColorBindings() {
      const modalFields = [
        ['modalBgDark', 'modalBgDarkHex'],
        ['modalAccentPrimary', 'modalAccentPrimaryHex'],
        ['modalTextColor', 'modalTextColorHex'],
        ['modalIconColor', 'modalIconColorHex'],
        ['modalSubtitleColor', 'modalSubtitleColorHex']
      ];

      modalFields.forEach(([pickerId, textId]) => {
        const picker = document.getElementById(pickerId);
        const text = document.getElementById(textId);
        picker.addEventListener('input', () => {
          const value = normalizeHex(picker.value, text.value || '#000000');
          picker.value = value;
          text.value = value;
          readModalColors();
        });
        text.addEventListener('input', () => {
          const value = normalizeHex(text.value, picker.value || '#000000');
          picker.value = value;
          text.value = value;
          readModalColors();
        });
      });
    }

    window.onload = async () => {
      renderPresets();
      renderRampSwatches();
      renderIconCheckboxes();
      initModalColorBindings();
      updateContent();
      updateColors();
      updateFont();

      try {
        const response = await fetch('Perfil2.jpg');
        if (response.ok) {
          const blob = await response.blob();
          const base64 = await fileToBase64(blob);
          const img = document.getElementById('displayImage');
          img.src = base64;
          img.style.display = 'block';
          document.querySelector('.placeholder-text').style.display = 'none';
        } else {
          document.querySelector('.placeholder-text').textContent = 'Carregue sua foto';
        }
      } catch (error) {
        console.log('Imagem padrão não encontrada ou erro ao converter.', error);
        document.querySelector('.placeholder-text').textContent = 'Carregue sua foto';
      }
    };
  </script>
</body>
</html>
