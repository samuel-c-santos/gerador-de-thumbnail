<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Thumbnail - Samuel Santos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:wght@300;400;700&family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700;800&family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0F172A;
      --accent-primary: #2563EB;
      --accent-secondary: #1D4ED8;
      --icon-color: #F8FAFC;
      --text-color: #FFFFFF;
      --subtitle-color: #A5B4CF;
      --tag-text-color: #EAF2FF;
      --page-bg: #eef3f9;
      --panel-bg: #ffffff;
      --soft-border: rgba(148, 163, 184, 0.28);
      --muted: #64748b;
      --shadow: 0 16px 38px rgba(15, 23, 42, 0.12);
      --font-body: 'Inter', sans-serif;
      --font-heading: 'Space Grotesk', 'Inter', sans-serif;
      --font-subtitle: 'Merriweather', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
        linear-gradient(180deg, #f5f8fc 0%, var(--page-bg) 100%);
      color: #0f172a;
      min-height: 100vh;
      padding: 32px 20px 80px;
    }

    .app-shell {
      max-width: 1360px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      font-size: clamp(1.8rem, 2vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #0f172a;
    }

    .topbar-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.16);
      color: #1d4ed8;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 22px;
      align-items: start;
    }

    .controls-panel {
      padding: 22px;
    }

    .preset-area {
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #475569;
      font-weight: 800;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(44px, 1fr));
      gap: 10px;
    }

    .preset-btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 14px;
      min-height: 52px;
      background: linear-gradient(135deg, #fff 0%, #eef3ff 100%);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.07);
    }

    .preset-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
    }

    .preset-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--preset-a), var(--preset-b));
    }

    .preset-btn.active {
      border-color: rgba(15, 23, 42, 0.2);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25), 0 12px 24px rgba(15, 23, 42, 0.12);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .input-group.wide {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #475569;
      font-weight: 800;
    }

    input[type="text"],
    select {
      border: 1px solid var(--soft-border);
      background: rgba(248, 250, 252, 0.9);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 0.96rem;
      font-family: inherit;
      color: #0f172a;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: rgba(37, 99, 235, 0.45);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .color-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(248, 250, 252, 0.9);
      border: 1px solid var(--soft-border);
      border-radius: 12px;
      padding: 6px 8px 6px 10px;
    }

    .color-control input[type="color"] {
      width: 40px;
      height: 38px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .color-control input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0;
      font-weight: 600;
    }

    .icon-picker {
      grid-column: 1 / -1;
      margin-top: 4px;
    }

    .icon-box {
      border: 1px solid var(--soft-border);
      background: rgba(248, 250, 252, 0.9);
      border-radius: 16px;
      padding: 12px;
    }

    .icon-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .icon-checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      text-transform: none;
      color: #334155;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-checkbox-group label:hover {
      background: rgba(241, 245, 249, 1);
      border-color: rgba(148, 163, 184, 0.5);
    }

    .icon-checkbox-group input[type="checkbox"] {
      accent-color: #2563eb;
      width: 14px;
      height: 14px;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(37, 99, 235, 0.2);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .preview-panel {
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(248,250,252,0.7));
    }

    .preview-shell {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }

    #thumbnail-container {
      width: min(100%, 1000px);
      max-width: 1000px;
      height: 525px;
      background: var(--bg-dark);
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 24px 40px rgba(15, 23, 42, 0.18);
      border-radius: 20px;
      transform-origin: top center;
      transform: scale(0.85);
      margin-bottom: -140px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 38px 38px;
      opacity: 0.42;
      z-index: 1;
    }

    .bg-glow {
      position: absolute;
      top: -18%;
      right: -10%;
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 64%);
      z-index: 1;
    }

    .content-side {
      flex: 1.45;
      padding: 58px 52px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      background: rgba(255,255,255,0.08);
      color: var(--tag-text-color);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .main-title {
      font-family: var(--font-heading);
      color: var(--text-color);
      font-size: clamp(2.3rem, 3vw, 4rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.055em;
      margin-bottom: 18px;
      max-width: 90%;
    }

    .subtitle {
      color: var(--subtitle-color);
      font-family: var(--font-subtitle);
      font-size: clamp(1.05rem, 1.6vw, 1.8rem);
      line-height: 1.3;
      max-width: 85%;
      font-weight: 300;
    }

    .tech-stack {
      margin-top: 28px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      max-width: 80%;
    }

    .tech-icon {
      font-size: 2.2rem;
      color: var(--icon-color);
      opacity: 0.96;
    }

    .image-side {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .image-blob-container {
      position: relative;
      width: 420px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blob-bg {
      position: absolute;
      inset: 0;
      background: var(--accent-primary);
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      opacity: 0.2;
      animation: morph 9s ease-in-out infinite;
    }

    .profile-img-frame {
      width: 350px;
      height: 350px;
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      overflow: hidden;
      position: relative;
      border: 5px solid rgba(255,255,255,0.1);
      background: rgba(15,23,42,0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-text {
      color: rgba(255,255,255,0.32);
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    @keyframes morph {
      0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
      33% { border-radius: 70% 30% 30% 70% / 60% 40% 60% 40%; }
      66% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.76);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-content {
      background: white;
      padding: 22px;
      border-radius: 18px;
      max-width: 90vw;
      width: 620px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
    }

    .modal-content h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .cropper-container-box {
      max-width: 100%;
      max-height: 420px;
      overflow: hidden;
      margin-bottom: 18px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    #imageCropper {
      display: block;
      max-width: 100%;
    }

    .cropper-buttons {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .cropper-buttons button {
      flex: 1;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
    }

    #cropAndApply {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
    }

    @media (max-width: 1080px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        padding-top: 0;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 18px 12px 40px;
      }

      .controls-panel,
      .preview-panel {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .preset-row {
        grid-template-columns: repeat(3, minmax(44px, 1fr));
      }

      #thumbnail-container {
        transform: scale(0.58);
        margin-bottom: -200px;
      }

      .content-side {
        padding: 40px 26px 28px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <h1>Gerador de Thumbnail</h1>
      <div class="topbar-badge"><i class="fas fa-palette"></i> Estilo premium</div>
    </div>

    <div class="editor-grid">
      <section class="panel controls-panel">
        <div class="preset-area">
          <div class="section-header">
            <div class="section-title">Paleta de cores</div>
          </div>
          <div class="preset-row" id="presetRow"></div>
        </div>

        <div class="form-grid">
          <div class="input-group wide">
            <label>Título principal</label>
            <input type="text" id="inputTitle" value="Samuel Santos" oninput="updateContent()">
          </div>

          <div class="input-group wide">
            <label>Badge / etiqueta</label>
            <input type="text" id="inputBadge" value="Portfólio Profissional" oninput="updateContent()">
          </div>

          <div class="input-group wide">
            <label>Subtítulo</label>
            <input type="text" id="inputSubtitle" value="Especialista em Geotecnologias" oninput="updateContent()">
          </div>

          <div class="input-group">
            <label>Fonte</label>
            <select id="fontSelect" onchange="updateFont()">
              <option value="'Inter', sans-serif">Inter</option>
              <option value="'Space Grotesk', 'Inter', sans-serif">Space Grotesk</option>
              <option value="'Manrope', 'Inter', sans-serif">Manrope</option>
              <option value="'Poppins', 'Inter', sans-serif">Poppins</option>
              <option value="'Montserrat', 'Inter', sans-serif">Montserrat</option>
              <option value="'Source Sans 3', 'Inter', sans-serif">Source Sans 3</option>
              <option value="'Merriweather', serif">Merriweather</option>
              <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
            </select>
          </div>

          <div class="input-group">
            <label>Foto de perfil</label>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
          </div>

          <div class="input-group">
            <label>Fundo escuro</label>
            <div class="color-control">
              <input type="color" id="inputBgDark" value="#0F172A" oninput="syncHexInput('bgDark')">
              <input type="text" id="inputBgDarkHex" value="#0F172A" maxlength="7" oninput="handleHexInput('bgDark', this.value)">
            </div>
          </div>

          <div class="input-group">
            <label>Destaque</label>
            <div class="color-control">
              <input type="color" id="inputAccentPrimary" value="#2563EB" oninput="syncHexInput('accentPrimary')">
              <input type="text" id="inputAccentPrimaryHex" value="#2563EB" maxlength="7" oninput="handleHexInput('accentPrimary', this.value)">
            </div>
          </div>

          <div class="input-group">
            <label>Texto</label>
            <div class="color-control">
              <input type="color" id="inputTextColor" value="#FFFFFF" oninput="syncHexInput('textColor')">
              <input type="text" id="inputTextColorHex" value="#FFFFFF" maxlength="7" oninput="handleHexInput('textColor', this.value)">
            </div>
          </div>

          <div class="input-group">
            <label>Ícones</label>
            <div class="color-control">
              <input type="color" id="inputIconColor" value="#F8FAFC" oninput="syncHexInput('iconColor')">
              <input type="text" id="inputIconColorHex" value="#F8FAFC" maxlength="7" oninput="handleHexInput('iconColor', this.value)">
            </div>
          </div>

          <div class="input-group">
            <label>Subtítulo</label>
            <div class="color-control">
              <input type="color" id="inputSubtitleColor" value="#A5B4CF" oninput="syncHexInput('subtitleColor')">
              <input type="text" id="inputSubtitleColorHex" value="#A5B4CF" maxlength="7" oninput="handleHexInput('subtitleColor', this.value)">
            </div>
          </div>

          <div class="input-group icon-picker">
            <label>Tecnologias (máx. 5)</label>
            <div class="icon-box">
              <div class="icon-checkbox-group" id="iconCheckboxes"></div>
            </div>
          </div>
        </div>

        <div class="action-row">
          <button class="primary-btn" onclick="downloadThumbnail()"><i class="fas fa-download"></i> Baixar PNG</button>
        </div>
      </section>

      <aside class="panel preview-panel">
        <div class="preview-shell">
          <div id="thumbnail-container">
            <div class="bg-grid"></div>
            <div class="bg-glow"></div>

            <div class="content-side">
              <div class="badge" id="displayBadge">
                <i class="fas fa-code"></i>
                <span>Portfólio Profissional</span>
              </div>

              <h1 class="main-title" id="displayTitle">Samuel Santos</h1>
              <p class="subtitle" id="displaySubtitle">Especialista em Geotecnologias</p>

              <div class="tech-stack" id="displayTechStack"></div>
            </div>

            <div class="image-side">
              <div class="image-blob-container">
                <div class="blob-bg"></div>
                <div class="profile-img-frame">
                  <img id="displayImage" class="profile-img" style="display: none;">
                  <div class="placeholder-text">Carregando...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div id="cropModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Ajustar imagem</h2>
      <div class="cropper-container-box">
        <img id="imageCropper" alt="Imagem para recorte">
      </div>
      <div class="cropper-buttons">
        <button id="cropAndApply"><i class="fas fa-check"></i> Aplicar</button>
        <button onclick="closeCropper()"><i class="fas fa-times"></i> Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    let cropper;
    const root = document.documentElement;

    const presetPalettes = [
      { name: 'Aipim', bg: '#0F172A', accent: '#22C55E', text: '#FFFFFF', icon: '#F8FAFC', subtitle: '#B7C5DE' },
      { name: 'Ocean', bg: '#061B2D', accent: '#2DD4BF', text: '#ECFEFF', icon: '#E0F2FE', subtitle: '#A9CDE3' },
      { name: 'Sunset', bg: '#1F2937', accent: '#F97316', text: '#FFF7ED', icon: '#FFF7ED', subtitle: '#F5CC9C' },
      { name: 'Violet', bg: '#111827', accent: '#A78BFA', text: '#F5F3FF', icon: '#F5F3FF', subtitle: '#CCC3F2' },
      { name: 'Rose', bg: '#1F1B2D', accent: '#F472B6', text: '#FDF2F8', icon: '#FDF2F8', subtitle: '#F7D4EC' },
      { name: 'Lime', bg: '#132A13', accent: '#84CC16', text: '#F0FDF4', icon: '#F0FDF4', subtitle: '#CFEFC0' },
      { name: 'Slate', bg: '#111827', accent: '#60A5FA', text: '#F8FAFC', icon: '#F8FAFC', subtitle: '#B7C4D7' }
    ];

    const allTechIcons = [
      { name: "Python", class: "fab fa-python" },
      { name: "JavaScript", class: "fab fa-js" },
      { name: "TypeScript", class: "fas fa-code" },
      { name: "HTML5", class: "fab fa-html5" },
      { name: "CSS3", class: "fab fa-css3-alt" },
      { name: "React", class: "fab fa-react" },
      { name: "Vue", class: "fab fa-vuejs" },
      { name: "Angular", class: "fab fa-angular" },
      { name: "Node.js", class: "fab fa-node-js" },
      { name: "Next.js", class: "fas fa-rocket" },
      { name: "Tailwind", class: "fas fa-wind" },
      { name: "Git", class: "fab fa-git-alt" },
      { name: "Docker", class: "fab fa-docker" },
      { name: "Figma", class: "fab fa-figma" },
      { name: "Database", class: "fas fa-database" },
      { name: "PostgreSQL", class: "fas fa-server" },
      { name: "MongoDB", class: "fas fa-database" },
      { name: "Redis", class: "fas fa-memory" },
      { name: "Cloud", class: "fas fa-cloud" },
      { name: "AWS", class: "fab fa-aws" },
      { name: "Mapa/GIS", class: "fas fa-map-marked-alt" },
      { name: "Análise", class: "fas fa-chart-pie" },
      { name: "IA", class: "fas fa-brain" },
      { name: "Design", class: "fas fa-paint-brush" },
      { name: "PHP", class: "fab fa-php" },
      { name: "Laravel", class: "fab fa-laravel" },
      { name: "Go", class: "fas fa-code" },
      { name: "Java", class: "fab fa-java" },
      { name: "C#", class: "fas fa-code" }
    ];

    function normalizeHex(value, fallback = '#000000') {
      if (!value) return fallback;
      let raw = value.trim();
      if (!raw) return fallback;

      if (raw.startsWith('#')) raw = raw.slice(1);
      if (raw.length === 3) raw = raw.split('').map(ch => ch + ch).join('');
      if (/^[0-9a-fA-F]{6}$/.test(raw)) return '#' + raw.toUpperCase();

      if (raw.startsWith('rgb')) {
        const match = raw.match(/rgba?\(([^)]+)\)/i);
        if (match) {
          const channels = match[1].split(',').map(part => Number(part.trim()));
          if (channels.length >= 3 && channels.every(n => !Number.isNaN(n))) {
            const [r, g, b] = channels.slice(0, 3).map(n => Math.max(0, Math.min(255, Math.round(n))));
            return '#' + [r, g, b].map(n => n.toString(16).padStart(2, '0')).join('').toUpperCase();
          }
        }
      }

      return fallback;
    }

    function hexToRgba(hex, opacity) {
      const normalized = normalizeHex(hex, '#2563EB');
      const r = parseInt(normalized.substring(1, 3), 16);
      const g = parseInt(normalized.substring(3, 5), 16);
      const b = parseInt(normalized.substring(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${opacity})`;
    }

    function applyPreset(palette) {
      document.getElementById('inputBgDark').value = palette.bg;
      document.getElementById('inputBgDarkHex').value = palette.bg;
      document.getElementById('inputAccentPrimary').value = palette.accent;
      document.getElementById('inputAccentPrimaryHex').value = palette.accent;
      document.getElementById('inputTextColor').value = palette.text;
      document.getElementById('inputTextColorHex').value = palette.text;
      document.getElementById('inputIconColor').value = palette.icon;
      document.getElementById('inputIconColorHex').value = palette.icon;
      document.getElementById('inputSubtitleColor').value = palette.subtitle;
      document.getElementById('inputSubtitleColorHex').value = palette.subtitle;
      updateColors();
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      const active = [...document.querySelectorAll('.preset-btn')].find(btn => btn.dataset.name === palette.name);
      if (active) active.classList.add('active');
    }

    function renderPresets() {
      const row = document.getElementById('presetRow');
      row.innerHTML = '';

      presetPalettes.forEach(palette => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'preset-btn';
        btn.title = palette.name;
        btn.dataset.name = palette.name;
        btn.style.setProperty('--preset-a', palette.accent);
        btn.style.setProperty('--preset-b', palette.icon);
        btn.innerHTML = '<span style="position:relative;z-index:1;display:block;width:100%;height:100%;"></span>';
        btn.addEventListener('click', () => applyPreset(palette));
        row.appendChild(btn);
      });

      const first = document.querySelector('.preset-btn');
      if (first) first.classList.add('active');
    }

    function syncHexInput(type) {
      const mapping = {
        bgDark: ['inputBgDark', 'inputBgDarkHex'],
        accentPrimary: ['inputAccentPrimary', 'inputAccentPrimaryHex'],
        textColor: ['inputTextColor', 'inputTextColorHex'],
        iconColor: ['inputIconColor', 'inputIconColorHex'],
        subtitleColor: ['inputSubtitleColor', 'inputSubtitleColorHex']
      };

      const keys = mapping[type];
      if (!keys) return;

      const picker = document.getElementById(keys[0]);
      const text = document.getElementById(keys[1]);
      const value = normalizeHex(picker.value, text.value || '#000000');
      picker.value = value;
      text.value = value;
      updateColors();
    }

    function handleHexInput(type, rawValue) {
      const mapping = {
        bgDark: ['inputBgDark', 'inputBgDarkHex'],
        accentPrimary: ['inputAccentPrimary', 'inputAccentPrimaryHex'],
        textColor: ['inputTextColor', 'inputTextColorHex'],
        iconColor: ['inputIconColor', 'inputIconColorHex'],
        subtitleColor: ['inputSubtitleColor', 'inputSubtitleColorHex']
      };

      const keys = mapping[type];
      if (!keys) return;

      const value = normalizeHex(rawValue, document.getElementById(keys[0]).value || '#000000');
      document.getElementById(keys[0]).value = value;
      document.getElementById(keys[1]).value = value;
      updateColors();
    }

    function updateColors() {
      const darkHex = normalizeHex(document.getElementById('inputBgDark').value, '#0F172A');
      const accentHex = normalizeHex(document.getElementById('inputAccentPrimary').value, '#2563EB');
      const textHex = normalizeHex(document.getElementById('inputTextColor').value, '#FFFFFF');
      const iconHex = normalizeHex(document.getElementById('inputIconColor').value, '#F8FAFC');
      const subtitleHex = normalizeHex(document.getElementById('inputSubtitleColor').value, '#A5B4CF');

      root.style.setProperty('--bg-dark', darkHex);
      root.style.setProperty('--accent-primary', accentHex);
      root.style.setProperty('--text-color', textHex);
      root.style.setProperty('--icon-color', iconHex);
      root.style.setProperty('--subtitle-color', subtitleHex);
      root.style.setProperty('--tag-text-color', textHex);
      root.style.setProperty('--accent-secondary', hexToRgba(accentHex, 0.85).replace(/rgba\(([^)]+)\)/, (_, rgb) => {
        const [r, g, b] = rgb.split(',').map(Number);
        return `rgb(${Math.max(0, r - 18)}, ${Math.max(0, g - 18)}, ${Math.max(0, b - 18)})`;
      }));
      root.style.setProperty('--accent-primary-low-opacity', hexToRgba(accentHex, 0.18));
      root.style.setProperty('--accent-primary-medium-opacity', hexToRgba(accentHex, 0.38));
      root.style.setProperty('--bg-dark-transparent', hexToRgba(darkHex, 0));

      document.getElementById('inputBgDark').value = darkHex;
      document.getElementById('inputBgDarkHex').value = darkHex;
      document.getElementById('inputAccentPrimary').value = accentHex;
      document.getElementById('inputAccentPrimaryHex').value = accentHex;
      document.getElementById('inputTextColor').value = textHex;
      document.getElementById('inputTextColorHex').value = textHex;
      document.getElementById('inputIconColor').value = iconHex;
      document.getElementById('inputIconColorHex').value = iconHex;
      document.getElementById('inputSubtitleColor').value = subtitleHex;
      document.getElementById('inputSubtitleColorHex').value = subtitleHex;
    }

    function updateFont() {
      const selectedFont = document.getElementById('fontSelect').value;
      root.style.setProperty('--font-body', selectedFont);
      root.style.setProperty('--font-heading', selectedFont);
      document.body.style.fontFamily = selectedFont;
    }

    function renderIconCheckboxes() {
      const container = document.getElementById('iconCheckboxes');
      container.innerHTML = '';

      allTechIcons.forEach(icon => {
        const id = `icon-${icon.name.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
        const isChecked = ['Python', 'Database', 'Mapa/GIS', 'JavaScript', 'Análise', 'Cloud'].includes(icon.name);

        const label = document.createElement('label');
        label.setAttribute('for', id);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = id;
        checkbox.value = icon.class;
        checkbox.checked = isChecked;
        checkbox.onchange = updateTechStack;

        const iconSpan = document.createElement('i');
        iconSpan.className = icon.class;

        const textNode = document.createTextNode(icon.name);

        label.appendChild(checkbox);
        label.appendChild(iconSpan);
        label.appendChild(textNode);
        container.appendChild(label);
      });

      updateTechStack();
    }

    function updateTechStack() {
      const selectedCheckboxes = Array.from(document.querySelectorAll('#iconCheckboxes input[type="checkbox"]:checked'));
      const displayContainer = document.getElementById('displayTechStack');
      displayContainer.innerHTML = '';

      const iconsToDisplay = selectedCheckboxes.slice(0, 5);
      iconsToDisplay.forEach(checkbox => {
        const iconElement = document.createElement('i');
        iconElement.className = `${checkbox.value} tech-icon`;
        displayContainer.appendChild(iconElement);
      });

      const checkboxes = document.querySelectorAll('#iconCheckboxes input[type="checkbox"]');
      if (selectedCheckboxes.length >= 5) {
        checkboxes.forEach(cb => {
          if (!cb.checked) cb.disabled = true;
        });
      } else {
        checkboxes.forEach(cb => {
          cb.disabled = false;
        });
      }
    }

    function updateContent() {
      document.getElementById('displayTitle').innerText = document.getElementById('inputTitle').value;
      document.getElementById('displaySubtitle').innerText = document.getElementById('inputSubtitle').value;
      const badge = document.getElementById('displayBadge');
      const badgeText = document.getElementById('inputBadge').value || 'Portfólio Profissional';
      badge.innerHTML = `<i class="fas fa-code"></i><span>${badgeText}</span>`;
    }

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    function openCropper(imageUrl) {
      const modal = document.getElementById('cropModal');
      const image = document.getElementById('imageCropper');
      image.src = imageUrl;
      modal.style.display = 'flex';

      if (cropper) cropper.destroy();

      cropper = new Cropper(image, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 0.9,
        responsive: true,
        background: false
      });
    }

    function closeCropper() {
      document.getElementById('cropModal').style.display = 'none';
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      document.getElementById('imageInput').value = '';
    }

    document.getElementById('cropAndApply').addEventListener('click', () => {
      if (!cropper) return;
      const croppedCanvas = cropper.getCroppedCanvas({ width: 420, height: 420 });
      const base64 = croppedCanvas.toDataURL('image/jpeg');
      const output = document.getElementById('displayImage');
      output.src = base64;
      output.style.display = 'block';
      document.querySelector('.placeholder-text').style.display = 'none';
      closeCropper();
    });

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const base64 = await fileToBase64(file);
        openCropper(base64);
      } catch (e) {
        console.error('Erro ao ler arquivo', e);
      }
    }

    function downloadThumbnail() {
      const element = document.getElementById('thumbnail-container');
      const currentTransform = element.style.transform;
      const currentMargin = element.style.marginBottom;

      element.style.transform = 'scale(1)';
      element.style.marginBottom = '0';

      setTimeout(() => {
        html2canvas(element, {
          backgroundColor: root.style.getPropertyValue('--bg-dark'),
          scale: 1,
          useCORS: true,
          allowTaint: true
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = 'thumbnail-personalizada.png';
          link.href = canvas.toDataURL('image/png');
          link.click();

          element.style.transform = currentTransform;
          element.style.marginBottom = currentMargin;
        }).catch(err => {
          console.error('Erro ao gerar imagem:', err);
          const modal = document.createElement('div');
          modal.style.cssText = `
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 12px; box-shadow: 0 16px 30px rgba(15,23,42,0.2);
            z-index: 2001; text-align: center; font-family: 'Inter', sans-serif; color: #0f172a;
          `;
          modal.innerHTML = `
            <p style="font-weight: 800; color: #ef4444;">Erro na captura</p>
            <p style="margin-top: 10px;">Verifique o console (F12) e tente novamente.</p>
            <button onclick="this.parentNode.remove()" style="margin-top: 18px; background:#ef4444; color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer;">Fechar</button>
          `;
          document.body.appendChild(modal);

          element.style.transform = currentTransform;
          element.style.marginBottom = currentMargin;
        });
      }, 80);
    }

    window.onload = async () => {
      renderPresets();
      renderIconCheckboxes();
      updateContent();
      updateColors();
      updateFont();

      try {
        const response = await fetch('Perfil2.jpg');
        if (response.ok) {
          const blob = await response.blob();
          const base64 = await fileToBase64(blob);
          const img = document.getElementById('displayImage');
          img.src = base64;
          img.style.display = 'block';
          document.querySelector('.placeholder-text').style.display = 'none';
        } else {
          document.querySelector('.placeholder-text').textContent = 'Carregue sua foto';
        }
      } catch (error) {
        console.log('Imagem padrão não encontrada ou erro ao converter.', error);
        document.querySelector('.placeholder-text').textContent = 'Carregue sua foto';
      }
    };
  </script>
